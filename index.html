<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omer & Roksana ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            z-index: 2;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ff6b81;
        }

        .subtitle {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 25px;
        }

        /* Sayğac qutusu (Titrəmənin qarşısını almaq üçün sabit ölçü və şrift) */
        .counter-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .counter-box h3 {
            font-size: 15px;
            margin-bottom: 8px;
            color: #ff9ff3;
        }

        #time-result {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            font-variant-numeric: tabular-nums; /* Rəqəmlərin enini sabit saxlayır ki, titrəmə olsun */
        }

        /* Kartlar */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card p {
            font-size: 15px;
            line-height: 1.5;
            color: #f1f2f6;
        }

        /* Sual hissəsi */
        .question-section {
            margin-top: 30px;
            position: relative;
            height: 150px;
        }

        .question-section h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        #yes-btn {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
        }

        #no-btn {
            background-color: #747d8c;
            color: white;
            position: absolute;
            left: 55%;
        }

        /* Ürək animasiyası */
        .heart {
            position: absolute;
            color: rgba(255, 107, 129, 0.6);
            font-size: 20px;
            animation: flyUp 4s linear infinite;
            z-index: 1;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Omer & Roksana ❤️</h1>
        <div class="subtitle">Her şey o gözel mesajla başladı...</div>

        <!-- Sayğac -->
        <div class="counter-box">
            <h3>İlk dəfə yazdığın andan keçən zaman:</h3>
            <div id="time-result">Yüklənir...</div>
        </div>

        <!-- Xatirə / Mesaj kartı -->
        <div class="card">
            <p>26 Avqust saat 13:53... O gün heyatımın en gözel anlarından biri oldu. Yaxşı ki varımsan yaxşıki heyatımdasan devuçkam menimm</p>
        </div>

        <!-- Sual və Düymələr -->
        <div class="question-section">
            <h2>Məni çox sevirsen??</h2>
            <div class="btn-group" id="btn-group">
                <button id="yes-btn" onclick="sayYes()">Da</button>
                <button id="no-btn" onmouseover="moveButton()" ontouchstart="moveButton()" onclick="moveButton()">Nyet</button>
            </div>
        </div>
    </div>

    <script>
        const startDate = new Date("2026-08-26T13:53:00");

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            if (diff < 0) {
                document.getElementById("time-result").innerText = "Tarix səhvdir və ya gələcəkdir!";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("time-result").innerText = `${days} gün, ${hours} saat, ${minutes} dəqiqə, ${seconds} saniyə`;
        }

        setInterval(updateCounter, 1000);
        updateCounter();

        // "Yox" düyməsinin qaçması
        function moveButton() {
            const noBtn = document.getElementById("no-btn");
            const x = Math.random() * 200 - 100;
            const y = Math.random() * 100 - 50;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // "Hə" düyməsinə basanda
        function sayYes() {
            alert("Da'ya basan ellerine gurban olum Roksanam, Meni dünyanın en xoşbext insanı etdiyin üçün teşekkur edirem heyatımın menası");
        }

        // Arxa fonda uçuşan ürəklər
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        setInterval(createHeart, 600);
    </script>
</body>
</html>
